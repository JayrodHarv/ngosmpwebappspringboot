<!-- fragments/image-picker.html -->

<div th:fragment="imagePicker(fieldName, images)">

    <div class="multi-image-picker">

        <div class="alert alert-danger d-none"
             id="imageUploadErrors">
        </div>

        <div class="card border-dashed">

            <div class="card-body text-center"
                 id="dropZone">

                <i class="bi bi-cloud-upload fs-1"></i>

                <h5>Drop images here</h5>

                <p>or click to select</p>

                <input type="file"
                       multiple
                       accept="image/*"
                       class="d-none"
                       id="imageInput">

            </div>
        </div>

        <div class="row mt-3 g-3"
             id="imageGallery">

            <div class="col-md-3 image-card"
                 th:each="image : ${images}"
                 th:data-image-id="${image.imageId}">

                <div class="card">

                    <img class="card-img-top"
                         th:src="${image.imagePath}">

                    <div class="card-body">

                        <button type="button"
                                class="btn btn-danger btn-sm remove-image">
                            Remove
                        </button>

                    </div>

                    <input type="hidden"
                           th:name="${fieldName}"
                           th:value="${image.imageId}">

                </div>
            </div>
        </div>
    </div>
</div>
