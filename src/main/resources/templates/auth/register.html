<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head><title>Register</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Create Account</h4>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}">Error</span>
                    </div>

                    <form th:action="@{/auth/register}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email (your login ID)</label>
                            <input id="email" name="email" type="email"
                                   class="form-control" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="displayName" class="form-label">Display Name</label>
                            <input id="displayName" name="displayName" type="text"
                                   class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password"
                                   class="form-control" required minlength="8"/>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input id="confirmPassword" name="confirmPassword" type="password"
                                   class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-person-check"></i> Register
                        </button>
                    </form>

                    <hr/>
                    <p class="text-center mb-0">
                        Already have an account? <a th:href="@{/auth/login}">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
