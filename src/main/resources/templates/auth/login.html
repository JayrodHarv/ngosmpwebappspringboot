<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head><title>Login</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h4>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}">Error</span>
                    </div>
                    <div th:if="${logout}" class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i> You have been logged out.
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input id="username" name="username" type="email"
                                   class="form-control" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password"
                                   class="form-control" required/>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember-me"
                                   id="rememberMe" class="form-check-input"/>
                            <label for="rememberMe" class="form-check-label">Remember me</label>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-dark w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </button>
                    </form>

                    <hr/>
                    <p class="text-center mb-0">
                        Don't have an account?
                        <a th:href="@{/auth/register}">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
