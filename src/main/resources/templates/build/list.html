<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Builds</title>
</head>

<main layout:fragment="content">

    <!-- ── Page Header ─────────────────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-hammer me-2"></i>Builds</h2>
        <a th:href="@{/builds/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Build
        </a>
    </div>

    <div th:replace="fragments/pagination :: searchAndPagination(${pageResult}, '/builds')"></div>
    
    <!-- ── Build Grid ───────────────────────────────────────────────────── -->
    <div th:if="${pageResult.items.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-inbox" style="font-size:3rem;"></i>
        <p class="mt-2">No builds found. Try adjusting your filters.</p>
    </div>

    <div th:unless="${pageResult.items.isEmpty()}" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">
        <div th:each="b : ${pageResult.items}" class="col">
            <th:block th:replace="~{fragments/buildCard :: buildCard(build=${b})}"/>
        </div>
    </div>
</main>
</html>
