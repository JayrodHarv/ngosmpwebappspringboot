<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title th:text="${editing} ? 'Edit ' + ${form.buildId} : 'New Build'">Build Form</title>
</head>

<main layout:fragment="content">

    <!-- ── Page Header ─────────────────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
            <i class="bi bi-hammer me-2"></i>
            <span th:text="${editing} ? 'Edit Build' : 'New Build'">Build Form</span>
        </h2>
        <a th:href="${editing} ? @{/builds/{id}(id=${form.buildId})} : @{/builds}"
           class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Cancel
        </a>
    </div>

    <form th:object="${form}"
          th:action="${editing}
                      ? @{/builds/{id}/edit(id=${form.buildId})}
                      : @{/builds/new}"
          method="post"
          enctype="multipart/form-data"
          class="row g-3"
          style="max-width:700px;">

        <!-- Build Name -->
        <div class="col-12 col-sm-6">
            <label class="form-label">
                Build Name
                <span class="text-danger">*</span>
            </label>

            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   required
                   placeholder="e.g. SpawnTower"/>
        </div>

        <!-- Date Built -->
        <div class="col-12 col-sm-6">
            <label class="form-label">
                Date Built
            </label>

            <input type="date"
                   th:field="*{dateBuilt}"
                   class="form-control"/>
        </div>

        <!-- Coordinates -->
        <div class="col-12">
            <label class="form-label">
                Coordinates
            </label>

            <div class="row g-2">
                <div class="col-4">
                    <div class="input-group">
                        <span class="input-group-text">X</span>
                        <input type="number"
                               th:field="*{xCoord}"
                               class="form-control"
                               placeholder="0"/>
                    </div>
                </div>
                <div class="col-4">
                    <div class="input-group">
                        <span class="input-group-text">Y</span>
                        <input type="number"
                               th:field="*{yCoord}"
                               class="form-control"
                               placeholder="64"/>
                    </div>
                </div>
                <div class="col-4">
                    <div class="input-group">
                        <span class="input-group-text">Z</span>
                        <input type="number"
                               th:field="*{zCoord}"
                               class="form-control"
                               placeholder="0"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="col-12">
            <label for="description" class="form-label">
                Description 
                <span class="text-danger">*</span>
            </label>
            <textarea th:field="*{description}"
                      class="form-control"
                      rows="4"
                      required
                      placeholder="Describe the build…">
            </textarea>
        </div>

        <!-- Tags --> 
        <div class="col-12"> 
            <label class="form-label"> Tags </label> 
            <div class="card"> 
                <div class="card-body"> 
                    <div class="row"> 
                        <div class="col-lg-3 col-md-4 col-sm-6 mb-2" th:each="tag : ${tags}"> 
                            <div class="form-check"> 
                                <input class="form-check-input" type="checkbox" th:field="*{tagIds}" th:value="${tag.tagId}"> 
                                <label class="form-check-label" th:text="${tag.tagName}"> </label>
                            </div> 
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/image-picker :: imagePicker(
                'buildImages',
                ${form.images}
        )}"></div>

        <!-- Submit -->
        <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-floppy me-1"></i>
                <span th:text="${editing} ? 'Save Changes' : 'Create Build'">Submit</span>
            </button>
            <a th:href="${editing} ? @{/builds/{id}(id=${form.buildId})} : @{/builds}"
               class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

    </form>

</main>

</html>
