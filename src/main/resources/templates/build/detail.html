<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/main}">

<head>
    <title th:text="${build.buildId}">Build Detail</title>
</head>

<main layout:fragment="content">

    <!-- ── Back link ───────────────────────────────────────────────────── -->
    <a th:href="@{/builds}" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i>All Builds
    </a>

    <div class="row g-4">

        <!-- ── Left: Image Gallery ─────────────────────────────────────── -->
        <div class="col-12 col-lg-7">

            <!-- Primary image / carousel -->
            <div th:if="${build.hasPrimaryImage()}"
                 id="buildCarousel"
                 class="carousel slide rounded shadow-sm"
                 data-bs-ride="false">

                <div class="carousel-inner">
                    <!-- Primary image first -->
                    <div class="carousel-item active">
                        <img th:src="@{/uploads/{path}(path=${build.filePath})}"
                             th:alt="${build.buildId}"
                             class="d-block w-100 rounded object-fit-cover"
                             style="max-height:480px;"/>
                    </div>
                    <!-- Additional images -->
                    <div th:each="img : ${build.images}"
                         th:if="${img.imageId != build.imageId}"
                         class="carousel-item">
                        <img th:src="@{/uploads/{path}(path=${img.filePath})}"
                             th:alt="${img.fileName}"
                             class="d-block w-100 rounded object-fit-cover"
                             style="max-height:480px;"/>
                    </div>
                </div>

                <!-- Controls — only show if there are extra images -->
                <th:block th:if="${build.images != null and build.images.size() > 1}">
                    <button class="carousel-control-prev" type="button"
                            data-bs-target="#buildCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button"
                            data-bs-target="#buildCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </th:block>
            </div>

            <!-- Placeholder when no image -->
            <div th:unless="${build.hasPrimaryImage()}"
                 class="rounded bg-secondary d-flex align-items-center justify-content-center shadow-sm"
                 style="height:300px;">
                <i class="bi bi-image text-white" style="font-size:4rem;"></i>
            </div>

            <!-- ── Add Image Form ──────────────────────────────────────── -->
            <div class="card mt-3">
                <div class="card-header fw-semibold">
                    <i class="bi bi-cloud-upload me-1"></i>Add Image
                </div>
                <div class="card-body">
                    <form th:action="@{/builds/{id}/images/add(id=${build.buildId})}"
                          method="post"
                          enctype="multipart/form-data"
                          class="row g-2 align-items-end">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small mb-1">Image file</label>
                            <input type="file" name="image" accept="image/*"
                                   class="form-control form-control-sm" required/>
                        </div>
                        <div class="col-auto">
                            <div class="form-check mt-1">
                                <input class="form-check-input" type="checkbox"
                                       name="isPrimary" id="isPrimary" value="true"/>
                                <label class="form-check-label small" for="isPrimary">
                                    Set as primary
                                </label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="bi bi-upload me-1"></i>Upload
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ── Image Thumbnails with Remove ───────────────────────── -->
            <div th:if="${build.images != null and !build.images.isEmpty()}"
                 class="mt-3 d-flex flex-wrap gap-2">
                <div th:each="img : ${build.images}" class="position-relative">
                    <img th:src="@{/uploads/{path}(path=${img.filePath})}"
                         th:alt="${img.fileName}"
                         class="rounded border"
                         style="width:80px;height:80px;object-fit:cover;"/>
                    <!-- Primary badge -->
                    <span th:if="${img.imageId == build.imageId}"
                          class="position-absolute top-0 start-0 badge bg-warning text-dark"
                          style="font-size:0.6rem;">Primary</span>
                    <!-- Remove button -->
                    <form th:action="@{/builds/{bid}/images/{iid}/remove(bid=${build.buildId}, iid=${img.imageId})}"
                          method="post"
                          class="position-absolute top-0 end-0 m-1">
                        <button type="submit"
                                class="btn btn-danger btn-sm p-0 lh-1"
                                style="width:20px;height:20px;font-size:0.7rem;"
                                title="Remove image"
                                onclick="return confirm('Remove this image?')">
                            <i class="bi bi-x"></i>
                        </button>
                    </form>
                </div>
            </div>

        </div>

        <!-- ── Right: Build Info ───────────────────────────────────────── -->
        <div class="col-12 col-lg-5">

            <h2 class="fw-bold" th:text="${build.buildId}">Build ID</h2>

            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item px-0">
                    <i class="bi bi-person me-2 text-muted"></i>
                    <strong>Builder:</strong>
                    <span th:text="${build.userDisplayName}">—</span>
                </li>
                <li class="list-group-item px-0">
                    <i class="bi bi-globe me-2 text-muted"></i>
                    <strong>World:</strong>
                    <span th:text="${build.worldId ?: 'Unknown'}">—</span>
                </li>
                <li class="list-group-item px-0">
                    <i class="bi bi-tags me-2 text-muted"></i>
                    <strong>Type:</strong>
                    <span th:text="${build.buildTypeId ?: 'Uncategorized'}">—</span>
                </li>
                <li class="list-group-item px-0">
                    <i class="bi bi-geo-alt me-2 text-muted"></i>
                    <strong>Coords:</strong>
                    <span th:text="${build.coordString()}">—</span>
                </li>
                <li class="list-group-item px-0" th:if="${build.dateBuilt != null}">
                    <i class="bi bi-calendar me-2 text-muted"></i>
                    <strong>Date Built:</strong>
                    <span th:text="${#temporals.format(build.dateBuilt, 'dd MMM yyyy')}">—</span>
                </li>
                <li class="list-group-item px-0" th:if="${build.createdAt != null}">
                    <i class="bi bi-clock me-2 text-muted"></i>
                    <strong>Logged:</strong>
                    <span th:text="${#temporals.format(build.createdAt, 'dd MMM yyyy HH:mm')}">—</span>
                </li>
            </ul>

            <p class="text-muted" th:text="${build.buildDescription}">No description.</p>

            <!-- Action buttons -->
            <div class="d-flex gap-2 mt-4">
                <a th:href="@{/builds/{id}/edit(id=${build.buildId})}"
                   class="btn btn-outline-primary">
                    <i class="bi bi-pencil me-1"></i>Edit
                </a>
                <form th:action="@{/builds/{id}/delete(id=${build.buildId})}"
                      method="post"
                      onsubmit="return confirm('Delete this build permanently?')">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                </form>
            </div>

        </div>
    </div>

</main>

</html>
