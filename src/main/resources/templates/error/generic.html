<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Error - SMP Portal</title>
    <th:block layout:fragment="head">
        <style>
            .error-container {
                min-height: 60vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .error-card {
                max-width: 600px;
                margin: 0 auto;
                border: none;
                box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
            }
            .error-icon {
                font-size: 4rem;
                color: #dc3545;
                margin-bottom: 1rem;
            }
            .error-type {
                font-size: 1.5rem;
                font-weight: bold;
                color: #dc3545;
                margin-bottom: 1rem;
            }
            .error-message {
                font-size: 1.1rem;
                color: #6c757d;
                margin-bottom: 2rem;
                padding: 1rem;
                background-color: #f8f9fa;
                border-radius: 0.5rem;
            }
            .status-code {
                font-size: 0.9rem;
                color: #6c757d;
                margin-top: 1rem;
            }
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="container error-container">
        <div class="card error-card">
            <div class="card-body text-center p-5">
                <div class="error-icon">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                
                <div class="error-type">
                    <span th:text="${errorType}">Error Type</span>
                </div>
                
                <div class="error-message">
                    <span th:text="${errorMessage}">Error message goes here</span>
                </div>
                
                <a th:href="@{/}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door"></i> Back to Home
                </a>
                
                <div class="status-code">
                    <small class="text-muted">
                        Status Code: <span th:text="${statusCode}">500</span>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
