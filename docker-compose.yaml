# Base service definitions shared by dev and prod.
# Credentials and environment-specific behavior live in the override files:
#   - docker-compose.override.yml  -> auto-loaded for local dev
#   - docker-compose.prod.yml      -> loaded explicitly for production

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    networks:
      - smpdb_net
    volumes:
      - mariadb_data:/var/lib/mysql
      # No init-db mount: Flyway (running inside the app on startup) now
      # owns schema creation and migrations. MariaDB's job is just to
      # create the empty `smpdb` database and `smpdb_app` user, which the
      # MARIADB_DATABASE / MARIADB_USER env vars in the override files
      # already handle.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - smpdb_net
    ports:
      - "8080:8080"

networks:
  smpdb_net:

volumes:
  mariadb_data:
